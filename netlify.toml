# Monorepo: el front Angular vive en stock-desktop/
[build]
  base = "stock-desktop"
  command = "npm ci && npm run build"
  publish = "dist/stock-desktop/browser"

# Angular SPA: todas las rutas → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
