<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/">Stock desktop</a>
    <nav class="shell__nav">
      @if (session(); as _s) {
        <a routerLink="/app/companies">Mis empresas</a>
        <button type="button" class="shell__signout" (click)="signOut()">Salir</button>
      } @else {
        <a routerLink="/auth/login">Entrar</a>
        <a routerLink="/auth/register" class="shell__nav-cta">Registrarse</a>
      }
    </nav>
  </header>
  <main class="shell__main">
    <router-outlet />
  </main>
</div>
