<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Stock desktop — El inventario de tu negocio, siempre al día</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Gestioná empresas, productos, ventas e inventario compartido con tu equipo. Acceso con correo o Google y autenticación en dos pasos."
  >
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet"
  >
  <script>
    (function () {
      try {
        var p = localStorage.getItem('stock-desktop-theme') || 'system';
        var dark =
          p === 'dark' ||
          (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
